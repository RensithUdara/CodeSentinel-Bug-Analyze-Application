[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "1.0.0"
description = "Code Quality Workbench"
authors = [{name = "CodeSentinel", email = "contact@codesentinel.com"}]
dependencies = [
    "PySide6>=6.5.0",
    "matplotlib>=3.7.0",
    "GitPython>=3.1.0",
    "jinja2>=3.0.0",
]

[project.scripts]
codesentinel = "cli.cli:main"
